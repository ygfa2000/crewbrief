<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5088e3">
<title>Crew Brief · Shared</title>
<style>
  :root { --bg:#f2f4f6; --card:#fff; --ink:#191f28; --ink2:#4e5968; --mute:#8b95a1; --line:#e5e8eb; --acc:#3182f6; --warn:#f04452; --soft:#f2f4f6; --blue:#5088e3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101013; --card:#1d1d22; --ink:#ececf0; --ink2:#b0b8c1; --mute:#7e8590; --line:#33333b; --acc:#4b96ff; --warn:#ff6b75; --soft:#26262c; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; cursor:pointer; }

  /* start screen: same blue and paper plane as the app's launch screen */
  #start { position:fixed; inset:0; background:var(--blue); background:color(display-p3 .315 .534 .891); color:#fff; overflow:hidden; z-index:5; transition:opacity .3s; }
  #start[hidden] { display:none; }
  #sky { position:absolute; inset:0; width:100%; height:100%; }
  .brand { position:absolute; left:0; right:0; text-align:center; font:800 26px ui-rounded,-apple-system,system-ui,sans-serif; }
  .keybox { position:absolute; left:16px; right:16px; margin:0 auto; max-width:340px; background:rgba(255,255,255,.16); border-radius:20px; padding:18px; transition:opacity .25s; }
  .keybox[hidden] { display:block; opacity:0; pointer-events:none; }
  .keybox label { display:block; font-size:13px; font-weight:600; opacity:.9; margin-bottom:8px; }
  .keybox input { width:100%; font:700 22px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; text-align:center; padding:14px 10px; border:0; border-radius:12px; color:#191f28; background:#fff; }
  .keybox button { width:100%; margin-top:10px; padding:14px; border:0; border-radius:12px; background:#191f28; color:#fff; font-weight:700; font-size:17px; }
  .keybox .msg { min-height:20px; margin-top:10px; font-size:14px; text-align:center; }

  /* shared schedule */
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(110px + env(safe-area-inset-bottom)); }
  #bar { position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; justify-content:center; align-items:center; gap:10px; padding:0 16px; z-index:3; }
  #bar[hidden] { display:none; }
  #bar .tabs { display:flex; flex:1; max-width:420px; padding:5px; border-radius:30px; background:color-mix(in srgb, var(--card) 82%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); box-shadow:0 6px 24px rgba(0,0,0,.14), 0 0 0 1px var(--line); }
  #bar .tabs button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:0; background:none; color:var(--ink); padding:7px 0 6px; border-radius:24px; font-size:12px; font-weight:600; }
  #bar .tabs button svg { width:24px; height:24px; }
  #bar .tabs button.on { color:var(--acc); background:color-mix(in srgb, var(--acc) 12%, transparent); }
  #sbtn { flex:none; width:60px; height:60px; border-radius:50%; border:0; color:var(--ink); background:color-mix(in srgb, var(--card) 82%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); box-shadow:0 6px 24px rgba(0,0,0,.14), 0 0 0 1px var(--line); display:grid; place-items:center; }
  #sbtn svg { width:26px; height:26px; }
  #sheet { position:fixed; inset:0; z-index:6; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center; padding:16px; }
  #sheet[hidden] { display:none; }
  .sbox { width:100%; max-width:420px; background:var(--card); border-radius:22px; padding:20px; display:grid; gap:10px; margin-bottom:env(safe-area-inset-bottom); }
  .sbox b { font-size:18px; }
  .sbox input { font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em; text-transform:uppercase; padding:13px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); }
  .sbox button[type=submit] { padding:14px; border:0; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; font-size:16px; }
  .sbox .link { border:0; background:none; color:var(--mute); font-size:14px; }
  .trip.up > summary { list-style:none; cursor:pointer; } .trip.up > summary::-webkit-details-marker { display:none; }
  .trip.up > summary h2::after { content:' ▸'; color:var(--mute); font-size:14px; } .trip.up[open] > summary h2::after { content:' ▾'; }
  .trip.up[open] > summary { margin-bottom:6px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 14px; }
  .top h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  .top .sub { margin-top:2px; }
  .sub { color:var(--mute); font-size:13px; }
  .refresh { border:0; background:var(--card); color:var(--acc); font-weight:700; font-size:14px; padding:9px 14px; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card { background:var(--card); border-radius:20px; padding:18px 20px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .hero { background:linear-gradient(135deg,#5aa5ff,#1b4fd0); color:#fff; }
  .hero .lbl { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
  .hero .row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px; }
  .route { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 4px; }
  .route b { font-size:40px; font-weight:800; letter-spacing:-.02em; }
  .route .mid { flex:1; text-align:center; opacity:.85; font-size:13px; border-top:2px dashed rgba(255,255,255,.45); padding-top:4px; }
  .times { display:flex; justify-content:space-between; font-size:17px; font-weight:600; }
  .trip h2 { font-size:17px; margin:0 0 2px; }
  .day { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .day:first-of-type { border-top:0; }
  .dh { display:flex; justify-content:space-between; gap:8px; font-weight:700; font-size:15px; }
  .day > summary { list-style:none; cursor:pointer; padding:4px 0; }
  .day > summary::-webkit-details-marker { display:none; }
  .day > summary > span::before { content:'▸'; display:inline-block; width:1.1em; color:var(--mute); }
  .day[open] > summary > span::before { content:'▾'; }
  .day:not(.now) > summary { opacity:.32; }
  .day.now .dh { font-size:17px; font-weight:800; }
  .leg { display:grid; grid-template-columns:4.2em 1fr auto; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .leg:last-of-type { border-bottom:0; }
  .leg .fl { color:var(--ink2); font-weight:600; font-size:14px; }
  .leg .rt { font-weight:700; font-size:17px; }
  .leg .rt small { display:block; font-weight:500; font-size:13px; color:var(--mute); }
  .lay { margin-top:8px; padding:8px 12px; border-radius:12px; background:var(--soft); font-size:14px; color:var(--ink2); }
  .ot { display:inline-block; text-align:center; line-height:1.25; font-size:12px; font-weight:700; border-radius:7px; padding:3px 8px; white-space:nowrap; }
  .ot b { display:block; }
  .ot.ok { color:#0e9f6e; background:rgba(14,159,110,.12); }
  .ot.late { color:var(--warn); background:rgba(240,68,82,.12); }
  .ot.done { color:var(--mute); background:var(--soft); }
  .hero .ot { font-size:13px; } .hero .ot b { display:inline; margin-left:4px; }
  .hero .ot.ok { background:#e7f8ef; color:#0b8a5f; } .hero .ot.late { background:#ffe3e6; color:#d92d3a; } .hero .ot.done { background:rgba(255,255,255,.2); color:#fff; }
  .empty { text-align:center; color:var(--mute); padding:30px 10px; }
  .foot { text-align:center; margin-top:18px; }
  .foot button { border:0; background:none; color:var(--mute); font-size:13px; text-decoration:underline; }
  /* header: same logo as the app, "For Friend" under the name, P · M · C · E clocks on the right */
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:4px 0 12px; }
  .logo { display:inline-flex; align-items:center; gap:10px; }
  .mark { width:36px; height:36px; flex:none; filter:drop-shadow(0 4px 10px rgba(49,130,246,.35)); }
  .word { display:inline-grid; font-size:23px; font-weight:800; letter-spacing:-.04em; line-height:1; }
  .word .wt { white-space:nowrap; } .word em { font-style:normal; color:var(--acc); }
  .word small { justify-self:center; white-space:nowrap; font-size:10px; font-weight:600; letter-spacing:.06em; color:var(--mute); margin-top:5px; }
  .zones { display:grid; grid-template-columns:auto auto; column-gap:7px; row-gap:4px; font-size:11px; font-weight:600; line-height:1.25; color:var(--ink2); font-variant-numeric:tabular-nums; }
  .zones > span { white-space:nowrap; }
  .tz { display:inline-block; width:12px; height:12px; border-radius:3px; margin:0 3px 0 2px; vertical-align:-1px; font:800 8.5px/12px -apple-system,system-ui,sans-serif; font-style:normal; text-align:center; color:#fff; }
  .tz-P { background:#8b5cf6; } .tz-M { background:#f08c00; } .tz-C { background:#0ca678; } .tz-E { background:#3182f6; }
</style>
</head>
<body>
<div id="start">
  <canvas id="sky"></canvas>
  <div class="brand" id="brand">Crew Brief</div>
  <form class="keybox" id="keyForm" autocomplete="off" hidden>
    <label for="key">Share key</label>
    <input id="key" maxlength="12" placeholder="XXXXXXXXXXXX" autocapitalize="characters" spellcheck="false">
    <button type="submit">Open</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<main id="view" hidden></main>
<nav id="bar" hidden>
  <div class="tabs">
    <button data-pg="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z" fill="currentColor" transform="rotate(45 12 12)"/></svg><span>Today</span></button>
    <button data-pg="up"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="14.5" r="1.3" fill="currentColor"/><circle cx="15" cy="14.5" r="1.3" fill="currentColor"/></svg><span>Upcoming</span></button>
  </div>
  <button id="sbtn" aria-label="Search a flight"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</nav>
<div id="sheet" hidden>
  <form id="sform" class="sbox" autocomplete="off">
    <b>Search a flight</b>
    <input id="sq" placeholder="e.g. UA5269" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    <button type="submit">Open in FlightAware</button>
    <div class="sub" id="smsg"></div>
    <button type="button" id="sclose" class="link">Close</button>
  </form>
</div>
<script>
const RELAY = 'https://script.google.com/macros/s/AKfycbz8uCeKdYFBjVW8HQh8tD55JFDkTQ1PNQcmtlITo76RG3Wrtn48hrcEbhpl8labYZ5Z/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mins = t => { const [h, m] = (t || '').split(':').map(Number); return h * 60 + m; };
const fmtHM = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const pad = n => String(n).padStart(2, '0');
const today = (d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`)(new Date());
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const md = s => { const d = new Date(s + 'T12:00:00'); return `${d.getMonth() + 1}/${d.getDate()} (${DOW[d.getDay()]})`; };
let key = '', shared = null;
try { key = localStorage.getItem('cbFriendKey') || ''; } catch (e) {}
const hk = /#sk=([A-Za-z0-9]{12})/.exec(location.hash);
if (hk) { key = hk[1].toUpperCase(); history.replaceState(null, '', location.pathname); }

function inAgo(l) {
  const w = x => ((x % 1440) + 1440) % 1440, nz = x => w(x + 720) - 720;
  if (!l.stdZ || !l.sta || !/^\d+:\d{2}$/.test(l.block || '')) return l.date < today ? 1e9 : 0;
  const depOff = nz(mins(l.std) - mins(l.stdZ)), arrOff = nz(mins(l.sta) - mins(l.stdZ) - mins(l.block));
  const out = Date.parse(`${l.date}T00:00:00Z`) + (mins(l.std) - depOff) * 6e4;
  return (Date.now() - (out + w(mins(l.in) - arrOff - mins(l.stdZ)) * 6e4)) / 6e4;
}
function status(l) {
  if (!l.std) return '';
  if (l.in && inAgo(l) > 60) return '<span class="ot done">Complete</span>';
  const lag = (a, b) => ((mins(a) - mins(b) + 2160) % 1440) - 720;
  const dl = l.on && l.sta ? lag(l.in || l.eta || l.on, l.sta) : lag(l.out || l.etd || l.std, l.std);
  const ph = l.in ? 'At gate' : l.on ? 'Landed' : l.off ? 'En route' : l.out ? 'Taxiing' : dl >= 5 ? 'Delayed' : 'On time';
  return `<span class="ot ${dl >= 5 ? 'late' : 'ok'}">${ph}${dl >= 5 ? `<b>+${fmtHM(dl)}</b>` : ''}</span>`;
}

const sky = (() => {
  const tilt = -40 * Math.PI / 180, v = 240, R = 90, tau = 0.75, L = 560, loopY = -30;
  const w = v / R, t1 = L / v, X = { x: Math.cos(tilt), y: Math.sin(tilt) }, Y = { x: Math.sin(tilt), y: -Math.cos(tilt) };
  const d0 = v * tau / 2, origin = { x: -X.x * d0 - Y.x * R, y: loopY - X.y * d0 - Y.y * R };
  const ramp = x => { x = Math.min(Math.max(x, 0), 1); return { s: x * x * (3 - 2 * x), i: x * x * x - x * x * x * x / 2 }; };
  const cv = $('sky'), g = cv.getContext('2d'), img = new Image();
  img.src = 'plane.png';
  let start = 0, down = null, raf = 0, done = null;
  function theta(t) {
    let th = w * tau * ramp((t - t1) / tau).i + w * Math.max(t - t1 - tau, 0), rate = w * ramp((t - t1) / tau).s;
    if (down != null && t > down) {
      const r = ramp((t - down) / tau);
      th -= w * Math.max(t - down, 0) - w * tau * (Math.min((t - down) / tau, 1) - r.i);
      rate -= w * r.s;
    }
    return { th, rate };
  }
  function spot(t) {
    const { th, rate } = theta(t);
    let d = v * (t - t1) - R * th, dd = v - R * rate;
    if (down != null && t > down + tau) { const u = t - down - tau; d += 450 * u * u; dd += 900 * u; }
    const fx = d + R * Math.sin(th), fy = R * (1 - Math.cos(th));
    const vx = dd + R * rate * Math.cos(th), vy = R * rate * Math.sin(th);
    return { x: origin.x + X.x * fx + Y.x * fy, y: origin.y + X.y * fx + Y.y * fy, head: Math.atan2(X.y * vx + Y.y * vy, X.x * vx + Y.x * vy) };
  }
  function frame() {
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const t = (performance.now() - start) / 1000, c = { x: W / 2, y: H / 2 }, out = down != null ? Math.max(t - down - tau, 0) : 0;
    g.lineCap = 'round';
    for (let k = 1, n = 32; k <= n; k++) {   // contrail: the last 0.8 s, fading
      const ta = t - 0.8 * k / n, tb = t - 0.8 * (k - 1) / n;
      if (ta <= 0) break;
      const p0 = spot(ta), p1 = spot(tb), a = 1 - k / n;
      g.strokeStyle = `rgba(255,255,255,${0.4 * a})`; g.lineWidth = 1.5 + 5 * a;
      g.beginPath(); g.moveTo(c.x + p0.x, c.y + p0.y); g.lineTo(c.x + p1.x, c.y + p1.y); g.stroke();
    }
    const f = spot(t), s = 0.6 * (1 + 0.4 * out);
    if (img.complete && img.naturalWidth) {
      g.save(); g.translate(c.x + f.x, c.y + f.y); g.rotate(f.head - tilt);
      const iw = img.naturalWidth / 3 * s, ih = img.naturalHeight / 3 * s;
      g.drawImage(img, -iw / 2, -ih / 2, iw, ih); g.restore();
    }
    const b = $('brand');
    b.style.top = `${c.y + 160 - 16}px`;
    b.style.opacity = Math.min(Math.max((t - 0.6) / 0.5, 0), 1) * Math.max(1 - out * 4, 0);
    $('start').style.opacity = out < 0.4 ? 1 : Math.max(1 - (out - 0.4) / 0.3, 0);
    raf = requestAnimationFrame(frame);
  }
  return {
    run() { cancelAnimationFrame(raf); start = performance.now(); down = null; done = null; $('start').style.opacity = 1; $('start').hidden = false; frame(); },
    leave(cb) {
      if (down != null) return;
      const now = (performance.now() - start) / 1000;
      let k = 1, d;
      do { d = t1 + tau + (2 * Math.PI * k - w * tau) / w; k++; } while (d < now);
      down = d;
      setTimeout(() => { cancelAnimationFrame(raf); $('start').hidden = true; cb(); }, (d + tau - now + 0.75) * 1000);
    },
    get inLoop() { return (performance.now() - start) / 1000 > t1; },
  };
})();
function askKey(msg) {
  const f = $('keyForm');
  f.style.bottom = `calc(24px + env(safe-area-inset-bottom))`;
  f.hidden = false; $('msg').textContent = msg || '';
  if (!msg) setTimeout(() => $('key').focus(), 50);
}

function fetchShare(k) {
  return fetch(`${RELAY}?f=share&sk=${encodeURIComponent(k)}`).then(r => r.json()).then(r => {
    if (!r.ok) throw new Error(r.error === 'unknown key' ? 'That key does not work — check it with the person who shared it' : r.error);
    return r;
  });
}
function openKey(k) {
  $('keyForm').hidden = true;
  fetchShare(k).then(r => {
    key = k; shared = r;
    try { localStorage.setItem('cbFriendKey', k); } catch (e) {}
    sky.leave(show);
  }).catch(err => { $('key').value = k; askKey(err.message); });
}
function refresh() {
  return fetchShare(key).then(r => { shared = r; show(); }).catch(() => {});
}

let page = 'today';
try { page = sessionStorage.getItem('cbFriendPage') || 'today'; } catch (e) {}
const dayHtml = (x, i, open) => `<details class="day${open ? ' now' : ''}"${open ? ' open' : ''}><summary class="dh"><span>Day ${i + 1} · ${md(x.date)}</span></summary>
    ${x.legs.map(l => `<div class="leg"><span class="fl">${esc(l.flight)}${l.dhd ? ' <span class="sub">DH</span>' : ''}</span>
      <span class="rt">${esc(l.from)} → ${esc(l.to)}<small>${esc(l.dep)}–${esc(l.arr)}</small></span>${status(Object.assign({ date: x.date }, l))}</div>`).join('')}
    ${x.city ? `<div class="lay">Overnight in ${esc(x.city)}${x.layover ? ` · ${esc(x.layover)} layover` : ''}</div>` : ''}</details>`;
const range = t => `${md(t.start)}${t.end !== t.start ? ` – ${md(t.end)}` : ''}`;
function show() {
  const v = $('view'); v.hidden = false; $('bar').hidden = false;
  const d = shared.data || { trips: [] }, who = shared.name || 'Crew';
  const trip = d.trips.find(t => t.start <= today && t.end >= today) || d.trips.find(t => t.start > today);
  const at = d.syncedAt ? (t => `${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`)(new Date(d.syncedAt)) : '';
  let body;
  if (page === 'up') {
    const later = d.trips.filter(t => t.start > (trip ? trip.end : today)).sort((a, b) => a.start.localeCompare(b.start));
    body = later.length ? later.map(t => {
      const ls = t.days.flatMap(x => x.legs), chain = ls.length ? [ls[0].from, ...ls.map(l => l.to)].join(' → ') : '';
      return `<details class="card trip up"><summary><h2>${range(t)}</h2><div class="sub">${esc(chain)}</div></summary>${t.days.map((x, i) => dayHtml(x, i, false)).join('')}</details>`;
    }).join('') : '<div class="card empty">No more trips shared yet.</div>';
  } else {
    const legs = trip ? trip.days.flatMap(x => x.legs.map(l => Object.assign({ date: x.date }, l))) : [];
    const next = legs.find(l => l.date >= today && !(l.in && inAgo(l) > 60));
    const hero = next ? `<div class="card hero"><div class="row"><span class="lbl">${next.date === today ? 'Today' : md(next.date)} · Flight ${esc(next.flight)}${next.dhd ? ' · riding' : ''}</span>${status(next)}</div>
        <div class="route"><b>${esc(next.from)}</b><span class="mid">${esc(next.block || '')}</span><b>${esc(next.to)}</b></div>
        <div class="times"><span>${esc(next.dep)}</span><span>${esc(next.arr)}</span></div></div>` : '';
    const openDay = trip && (trip.days.some(x => x.date === today) ? today : trip.days[0].date);
    body = hero + (trip ? `<div class="card trip"><h2>${range(trip)}</h2>${trip.days.map((x, i) => dayHtml(x, i, x.date === openDay)).join('')}</div>`
      : '<div class="card empty">No upcoming flights shared yet.</div>');
  }
  v.innerHTML = `${HDR}<div class="top"><div><h1>${esc(who)}’s flights</h1><div class="sub">${at ? `Updated ${at} · ` : ''}local airport times</div></div><button class="refresh" id="again">↻ Refresh</button></div>
    ${body}
    <div class="foot"><button id="change">Use a different key</button></div>`;
  clocks();
  document.querySelectorAll('#bar [data-pg]').forEach(b => b.classList.toggle('on', b.dataset.pg === page));
}

const HDR = `<header class="hdr"><span class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa5ff"/><stop offset="1" stop-color="#1b64da"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#cbg)"/><path d="M9 27c6-1 14-5 22-14" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M10.5 21.5 30 12.5l-6.2 16.2-4.3-5.6z" fill="#fff"/><path d="m19.5 23.1 10.5-10.6-12.2 8.9z" fill="#cfe2ff"/></svg><span class="word"><span class="wt">Crew <em>Brief</em></span><small>For Friend</small></span></span><div class="zones" id="zones"></div></header>`;
const TZ_CLOCKS = [['P', 'America/Los_Angeles'], ['M', 'America/Denver'], ['C', 'America/Chicago'], ['E', 'America/New_York']];
function clocks() {
  const el = document.getElementById('zones'), d = new Date();
  if (el) el.innerHTML = TZ_CLOCKS.map(([k, zn]) => `<span><i class="tz tz-${k}">${k}</i>${d.toLocaleTimeString('en-GB', { timeZone: zn, hour: '2-digit', minute: '2-digit' })}</span>`).join('');
}
setInterval(clocks, 1000);

function search() {
  const q = $('sq').value.toUpperCase().replace(/[\s-]/g, '');
  if (!/^[A-Z0-9]{2,3}\d{1,4}[A-Z]?$/.test(q) || /^\d+$/.test(q)) { $('smsg').textContent = 'Add the airline code, e.g. UA5269'; return; }
  window.open(`https://www.flightaware.com/live/flight/${encodeURIComponent(q)}`, '_blank', 'noopener');
  $('sheet').hidden = true;
}
$('sform').addEventListener('submit', e => { e.preventDefault(); search(); });
$('keyForm').addEventListener('submit', e => {
  e.preventDefault();
  const k = $('key').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (k.length !== 12) { $('msg').textContent = 'The key has 12 letters and numbers'; return; }
  $('msg').textContent = '';
  openKey(k);
});
document.addEventListener('click', e => {
  const pg = e.target.closest('[data-pg]');
  if (pg) { page = pg.dataset.pg; try { sessionStorage.setItem('cbFriendPage', page); } catch (er) {} show(); scrollTo(0, 0); return; }
  if (e.target.closest('#sbtn')) { $('sq').value = ''; $('sheet').hidden = false; $('smsg').textContent = ''; setTimeout(() => $('sq').focus(), 50); return; }
  if (e.target.id === 'sheet' || e.target.id === 'sclose') { $('sheet').hidden = true; return; }
  if (e.target.id === 'again') { e.target.textContent = 'Refreshing…'; refresh(); }
  if (e.target.id === 'change') {
    try { localStorage.removeItem('cbFriendKey'); } catch (er) {}
    key = ''; shared = null; $('key').value = '';
    $('view').hidden = true; $('bar').hidden = true; sky.run(); askKey();
  }
});
setInterval(() => { if (shared && !document.hidden && $('start').hidden) refresh(); }, 5 * 6e4);
sky.run();
if (key) openKey(key);
else setTimeout(() => askKey(), 2300);   // after the plane has flown in
</script>
</body>
</html>
