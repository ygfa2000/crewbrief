<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crew Brief</title>
<style>
  :root { --bg:#f4f5f7; --ink:#1b1f24; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --ink:#e7e9ec; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px -apple-system,system-ui,sans-serif; }
  iframe { display:block; border:0; width:100%; height:100%; }
  p { padding:24px; }
</style>
</head>
<body>
<script>
// Crew Brief frame: shows the Apps Script app full screen (no Apps Script banner inside a frame).
// The app address and key live only in the #a= part of this page's address, which is never sent to this server.
(function () {
  var m = /[#&]a=([^&]+)/.exec(location.hash), u = null;
  try { u = m && new URL(decodeURIComponent(m[1])); } catch (e) {}
  if (!u || u.hostname !== 'script.google.com') {
    document.body.innerHTML = '<p>Open this page with your own Crew Brief link.</p>';
    return;
  }
  u.searchParams.set('shell', location.href);
  var f = document.createElement('iframe');
  f.src = u.href;
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
